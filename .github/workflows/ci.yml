name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - name: Check the code style and test
        run: nix develop -c bash -c 'pnpm install --frozen-lockfile && pnpm format:check && pnpm test'

      # Builds the CLI package, which also checks the fetchPnpmDeps hash, and the widget.
      - name: Build
        run: nix build -L .#default .#plasmoid
